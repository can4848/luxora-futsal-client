name: Paketler

# Üç platformun paketini GitHub'ın makinelerinde üretir. Mac paketi yalnızca
# Mac'te, Linux AppImage'ı yalnızca Linux/Mac'te üretilebildiği için bu iş
# burada. `v` ile başlayan bir etiket gönderilince paketler bir sürüme eklenir.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win zip
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # İmza sertifikası yok: Windows "bilinmeyen yayıncı" der, Mac'te ilk
      # açılışta sağ tık → Aç gerekir. Mac paketi geçici (ad-hoc) imzalıdır;
      # imzasız olsaydı Apple Silicon'da hiç açılmazdı.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: paket-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
